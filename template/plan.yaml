
stages:
  - stage: TerraformPlan
    displayName: Terraform Plan
    jobs:
      - job: TerraformPlan
        displayName: Terraform Plan
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
            backendServiceArm: 'home-svc'
            backendAzureRmStorageAccountName: 'stghomecare101'
            backendAzureRmContainerName: 'homecare'
            backendAzureRmKey: 'dev.tfstate'    

        - task: TerraformTask@5
          inputs:
             provider: 'azurerm'
             command: 'plan'
             workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
             environmentServiceNameAzureRM: 'home-svc'



